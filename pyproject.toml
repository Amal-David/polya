[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polya-puzzles"
version = "0.3.0"
description = "Composable puzzle-solving tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3; python_version < '3.14'",
  "pydantic>=2.12,<3; python_version >= '3.14' and python_version < '3.15'",
  "pydantic>=2.14.1,<3; python_version >= '3.15'",
  "cryptography>=44,<51; python_version < '3.15'",
  "cryptography>=50.0.2,<51; python_version >= '3.15'",
]
license = {text = "MIT"}
keywords = ["puzzle-solving", "ai-agents", "mcp", "constraints", "automata", "z3"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/Amal-David/polya"
Repository = "https://github.com/Amal-David/polya"
Issues = "https://github.com/Amal-David/polya/issues"
Documentation = "https://github.com/Amal-David/polya/tree/main/docs"

[project.optional-dependencies]
imaging = ["pillow>=11.3,<14"]
z3 = ["z3-solver>=4.13,<5"]
cpsat = ["ortools>=9.12,<10"]
solvers = ["z3-solver>=4.13,<5", "ortools>=9.12,<10"]
learning = ["aalpy>=1.5,<2"]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
polya = "polya.__main__:main"
polya-mcp = "polya.mcp_server:main"

[tool.setuptools.packages.find]
include = ["polya*", "puzzleops"]

[tool.setuptools.package-data]
polya = ["jacobian_pin.json"]
"polya.methods" = ["data/*.json", "data/*.md"]
