name: Review source snapshot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source and exact revision
        run: |
          git rev-parse HEAD > source-revision.txt
          git archive --format=zip --output=reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: |
            reviewed-source.zip
            source-revision.txt
          if-no-files-found: error
