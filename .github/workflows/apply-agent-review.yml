name: Apply checksum-reviewed agent patch
on:
  push:
    branches: [fix/agent-composition-and-recovery]
    paths:
      - '.review-transfer/**'
      - '.github/workflows/apply-agent-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polya-reviewed-patch-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/agent-composition-and-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Decode only the exact locally tested patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, os, re
          expected = [
              '360dff7b0bf80e6b0d1d731cd2686eeed39ba2b0',
              '3fe2f6fd53fbec9e85358862ed81a5e0aaec8440',
              'a97ad34dee75b0bb3f271fba573b77d8d6341b8d',
              'c0725640a9828107a5ea6e0f6757912152e0a17a',
              'bd82d9e96ad18093bd2939f14bd5ffcdb3c4d1e3',
              '7fc365fe63b67a109b97778f19d80075b16c930e',
              '2d25042d5b087cd9cf0d577090b0c4ed922625b4',
              '0ebdaade4d57ef3d25470a05ed32ec541189e325',
              '3b93acf435b1d72d762b3cda63dd4667d83f1530',
              'e70caae08180b582082ea9e1d57d7724aedba48a',
              '49c798baf31d4bac88c778dc9e49b9c79f90a67a',
              '702aa50ba5cca8436523894a229311dc830a683a',
              'd922a0d8d990d16766867aaeccd76a01cf8ac63d',
          ]
          chunks = []
          for i, sha in enumerate(expected):
              text = Path(f'.review-transfer/part{i:02}.b64').read_text(encoding='ascii')
              # Correct three identified text-transfer errors, never change code semantics.
              if i == 1:
                  text = text.replace('QuSxRRyVJEs08GzIT', 'QuSzRRyVJEs09GzIT')
              elif i == 2:
                  text = text.replace('CztduHNut1', 'CztduAut1')
              elif i == 5:
                  text = re.sub(r'Y\+/Y(?:0N/o)+0N/l', 'Y+/Y' + '0N/o' * 6 + '0N/l', text)
              raw = text.encode('ascii')
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == sha, (i, actual, sha)
              chunks.append(raw)
          encoded = b''.join(chunks)
          assert len(encoded) == 36544
          compressed = base64.b64decode(encoded, validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch = stream.read(90933)
          assert len(patch) == 90932
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'cb41d046ef221dde882c996ceb74691a8e8e3325da64953c46cacb8d64842dfa'
          Path(os.environ['RUNNER_TEMP'], 'reviewed.patch').write_bytes(patch)
          print('Verified patch', digest)
          PY
      - name: Apply without rewriting the branch and verify the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check "$RUNNER_TEMP/reviewed.patch"
          git apply "$RUNNER_TEMP/reviewed.patch"
          rm -r .review-transfer
          rm .github/workflows/apply-agent-review.yml
          git add -A
          ACTUAL_TREE=$(git write-tree)
          test "$ACTUAL_TREE" = '2dddf0f384ffc22cfcb540f5e799d5379eb9a320'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply exact checksum-reviewed agent workflow improvements'
          git push origin HEAD:refs/heads/fix/agent-composition-and-recovery
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
