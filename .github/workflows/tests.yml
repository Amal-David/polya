name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' 'z3-solver>=4.13,<5'
      - run: python -m pytest -q --junitxml=core-tests.xml
  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,solvers,learning]'
      - name: Require optional packages rather than silently skipping
        run: python -c 'import ortools, aalpy; from puzzleops.native_z3 import native_version; assert native_version()'
      - run: python -m pytest -q --junitxml=full-tests.xml
      - run: python -m examples.structured_demo
