name: Crypto readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-to-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,imaging]' 'z3-solver>=4.13,<5'
      - name: Require real image decoder and independent crypto producer
        run: |
          python -c "from PIL import Image; import shutil; assert shutil.which('openssl')"
          openssl version
      - run: python -m pytest tests/test_crypto_targets.py tests/test_artifact_png.py -q -rs --junitxml=crypto-tests.xml
      - run: python -m examples.crypto_frontier_demo > crypto-readiness.json
      - name: Preserve the exact tested source tree
        run: git archive --format=zip --output=crypto-tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-readiness
          path: |
            crypto-readiness.json
            crypto-tests.xml
            crypto-tested-source.zip
          if-no-files-found: error
